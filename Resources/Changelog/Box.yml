  changes:
  - message: NuBody & accompanying Metabolism changes have been merged, alongside
      other WizDen features.
    type: Tweak
  - message: (Bones) SynthChem metabolism has been rewritten, and now shows what chems
      affect what categories in the guidebook
    type: Tweak
  - message: (DizzyEevee) Added harpies, a species of colorful avian humanoids capable
      of mimicking sounds and instruments.
    type: Add
  - message: (DizzyEevee) 63 new hairstyles have been brought over from Impstation!
    type: Add
