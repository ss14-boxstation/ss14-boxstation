# Free

- type: trait
  id: WizDenAccentless # Box Change: ID sniped for DV trait system
  name: trait-accentless-name
  description: trait-accentless-desc
  category: SpeechTraits
  cost: 0 #Harmony change-Changed from 2 to 0, should just be free
  components:
  - type: Accentless
    removes:
    - type: LizardAccent
    - type: MothAccent
    - type: ReplacementAccent
      accent: dwarf
    - type: NoContractionsAccent # Box Change - Accentless Thaven
    - type: AllulaloAccent # Box Change - Accentless Allulalo

