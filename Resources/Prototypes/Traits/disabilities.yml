# If you add a new trait, make sure to add the corresponding component to the whitelist in \Resources\Prototypes\Entities\Mobs\Player\clone.yml so it gets copied to clones correctly!
# Box: Traits have been moved to _Box/Traits, any necessary changes should be made there.

- type: trait
  id: WizDenBlindness # Box Change: ID sniped for DV trait system
  name: trait-blindness-name
  description: trait-blindness-desc
  traitGear: WhiteCane
  category: Disabilities
  whitelist:
    components:
      - Blindable
  components:
    - type: PermanentBlindness

- type: trait
  id: WizDenPoorVision # Box Change: ID sniped for DV trait system
  name: trait-poor-vision-name
  description: trait-poor-vision-desc
  #traitGear: ClothingEyesGlasses # Box Change: Moved to imp's StartWithLenses system
  category: Disabilities
  whitelist:
    components:
      - Blindable
  components:
    - type: PermanentBlindness
      blindness: 4
    - type: StartWithLenses # imp addition

- type: trait
  id: WizDenNarcolepsy # Box Change: ID sniped for DV trait system
  name: trait-narcolepsy-name
  description: trait-narcolepsy-desc
  category: Disabilities
  components:
    - type: Narcolepsy
      maxTimeBetweenIncidents: 600
      minTimeBetweenIncidents: 300
      maxDurationOfIncident: 30
      minDurationOfIncident: 10

- type: trait
