- type: particleEffect
  id: SfSparks
  sprite:
    sprite: _Starfall/Particles/generic.rsi
    state: cross
  burst: true
  colorOverLifetime:
    - time: 0.0
      color: "#fffa45"
    - time: 0.9
      color: "#fffdc9"
    - time: 1.0
      color: "#ffffff"
  alphaOverLifetime:
    - time: 0.0
      value: 1.0
    - time: 0.9
      value: 1.0
    - time: 1.0
      value: 0.0
  sizeOverLifetime:
    - time: 0.0
      value: 1.0
    - time: 0.8
      value: 1.0
    - time: 1.0
      value: 0.3
  shader: unshaded
  particleSize: 1
  sizeVariance: 0.1
  lifetime: 0.3
  lifetimeVariance: 0.3
  speed: 3.5
  speedVariance: 2.5
  drag: 0.5
  gravity: 2
  maxCount: 10
  simulationSpace: grid
  shape:
    type: CircleFill
    radius: 0.1
  spreadAngle: 270

- type: particleEffect
  id: SfBloodSpray
  sprite:
    sprite: _Starfall/Particles/generic.rsi
    state: dot
  burst: true
  particleSize: 2
  lifetime: 0.3
  speed: 2.5
  speedVariance: 2.5
  gravity: 5.0
  drag: 0.02
  emissionRate: 10
  maxCount: 30
  simulationSpace: grid
  shape:
    type: CircleFill
    radius: 0.1
  spreadAngle: 120
  stretchFactor: 0
