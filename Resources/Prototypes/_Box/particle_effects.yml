- type: particleEffect
  id: BoxSparks
  sprite:
    sprite: _Starfall/Particles/generic.rsi
    state: dot
  burst: true
  colorOverLifetime:
    - time: 0.0
      color: "#fffa45"
    - time: 0.9
      color: "#fffdc9"
    - time: 1.0
      color: "#ffffff"
  alphaOverLifetime:
    - time: 0.0
      value: 1.0
    - time: 0.9
      value: 0.5
    - time: 1.0
      value: 0.0
  sizeOverLifetime:
    - time: 0.0
      value: 1.0
    - time: 0.8
      value: 0.5
    - time: 1.0
      value: 0.3
  shader: unshaded
  particleSize: 2
  sizeVariance: 0.5
  lifetime: 0.3
  lifetimeVariance: 0.2
  speed: 3.5
  speedVariance: 1.5
  drag: 2
  noiseStrength: 0.5
  noiseFrequency: 0.9
  gravity: 1
  startRotationVariance: 60
  maxCount: 6
  simulationSpace: grid
  shape:
    type: CircleFill
    radius: 0.1
  spreadAngle: 270
  
- type: particleEffect
  parent: BoxSparks
  id: BoxSparksOffset
  rotateWithEmitter: true
  spawnOffset: 0, -0.2

- type: particleEffect
  id: BoxAcidSpray
  sprite:
    sprite: _Starfall/Particles/generic.rsi
    state: dot
  startColor: "#FFFFFFFF"
  endColor: "#FFFFFFFF"
  lifetime: 0.4
  lifetimeVariance: 0.2
  speed: 50
  speedVariance: 2.5
  particleSize: 4
  sizeVariance: 0.3  
  sizeOverLifetime:
    - time: 0
      value: 1
    - time: 1
      value: 0
  noiseStrength: 0.5
  noiseFrequency: 1
  startRotationVariance: 90
  maxCount: 150
  burst: true
  gravity: 0
  drag: 25
  spreadAngle: 360
  shape:
    type: CircleFill
    radius: 0.2
