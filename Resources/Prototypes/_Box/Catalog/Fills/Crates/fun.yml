- type: entity
  parent: CrateGenericSteel
  id: CrateWhiteChessPiece
  name: white chess piece set
  suffix: Box
  description: A full set of large white chess pieces, including some extra for pawn promotions!
  components:
  - type: StorageFill
    contents:
    - id: WhitePawn
      amount: 8
    - id: WhiteRook
      amount: 3
    - id: WhiteKnight
      amount: 3
    - id: WhiteBishop
      amount: 3
    - id: WhiteQueen
      amount: 2
    - id: WhiteKing

- type: entity
  parent: CrateGenericSteel
  id: CrateBlackChessPiece
  name: black chess piece set
  suffix: Box
  description: A full set of large black chess pieces, including some extra for pawn promotions!
  components:
  - type: StorageFill
    contents:
    - id: BlackPawn
      amount: 8
    - id: BlackRook
      amount: 3
    - id: BlackKnight
      amount: 3
    - id: BlackBishop
      amount: 3
    - id: BlackQueen
      amount: 2
    - id: BlackKing

- type: entity
  parent: CrateGenericSteel
  id: CrateGlowsticks
  name: glowstick crate
  description: A set of 8 glowsticks of random colors.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children: 
          - !type:GroupSelector
            children: &glowsticks
            - id: GlowstickGreen
            - id: GlowstickBlue
            - id: GlowstickYellow
            - id: GlowstickPurple
            - id: GlowstickRed
          - !type:GroupSelector
            children: *glowsticks
          - !type:GroupSelector
            children: *glowsticks
          - !type:GroupSelector
            children: *glowsticks
          - !type:GroupSelector
            children: *glowsticks
          - !type:GroupSelector
            children: *glowsticks
          - !type:GroupSelector
            children: *glowsticks
          - !type:GroupSelector
            children: *glowsticks
          - !type:GroupSelector
            children: *glowsticks
