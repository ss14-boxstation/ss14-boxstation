- type: entity
  parent: BoxCardboard
  id: BoxTeaPouches
  name: NTea variety pack
  description: A colorful variety of tea (and coffee) to serve the bar's more pompous patrons.
  components:
  - type: Item
    sprite: _Box/Objects/Storage/boxes.rsi
    size: Large
    shape:
    - 0,0,3,3
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,8,0
    - 0,1,7,1
  - type: Sprite
    sprite: _Box/Objects/Storage/boxes.rsi
    layers:
    - state: boxwide-nanotrasen
    - state: tea
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ReagentContainerBlackTeaPouch
        - id: ReagentContainerDecafBlackTeaPouch
        - id: ReagentContainerGreenTeaPouch
        - id: ReagentContainerChamomileTeaPouch
        - id: ReagentContainerFruitTeaPouch
        - id: ReagentContainerBerryTeaPouch
        - id: ReagentContainerCoffeePouch
        - id: ReagentContainerDecafCoffeePouch
        - id: PaperWrittenTeaGuide
