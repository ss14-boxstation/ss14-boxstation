- type: entityTable
  id: BasicChillEventsTable
  table: !type:AllSelector
    children:
    - id: AnomalySpawn
    - id: BluespaceArtifact
    - id: BluespaceLocker
    - id: CockroachMigration
    - id: MassHallucinations
    - id: MouseMigration
    - id: RandomSentience
    - id: SolarFlare

- type: entityTable
  id: RedShiftEventsTable # Redshift events should be interesting
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: BasicChillEventsTable # No need to duplicate events
    - id: BreakerFlip
    - id: GasLeak
    - id: IonStorm
    - id: PowerGridCheck
    - id: VentClog

- type: entityTable
  id: RedShiftAntagTable # Redshift Antags should be interesting but limited. Dangerous antags should be limited to "Survival" and "Extended"
  table: !type:AllSelector
    children:
    - !type:NestedSelector # DeltaV
      tableId: BasicAntagEventsTableDeltaV
    - !type:NestedSelector
      tableId: DerelictBorgEventTable
    - id: RevenantSpawn
    - id: SlimesSpawn
    - id: SnakeSpawn
    - id: SpiderClownSpawn
    - id: SpiderSpawn
    - id: CarpMigration
    - id: BingleSpawn
    - id: LesserDroneSpawn
    - id: SyndicateDeadDrop

- type: entity
  id: LesserDroneSpawn
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-vent-creatures-start-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    earliestStart: 20
    minimumPlayers: 10
    weight: 1.5
    duration: 30
  - type: VentCrittersRule
    min: 5 
    max: 10
    playerRatio: 10 # Lessers only have 30 HP, but spawn in much bigger groups
    table:
      id: MobXenoLesserDrone
