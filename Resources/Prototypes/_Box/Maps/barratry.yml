- type: gameMap
  id: Barratry
  mapName: 'Barratry'
  mapPath: /Maps/_Box/barratry.yml
  minPlayers: 15
  maxPlayers: 40
  stations:
    Barratry:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Pioneer {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Harmony/Shuttles/emergency_pioneer.yml
        - type: StationCargoShuttle
          path: /Maps/_Harmony/Shuttles/cargo_barratry.yml
        - type: StationJobs
          availableJobs: # 51 jobs, 61 w/ Interns
          #service (12)
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            Bartender: [ 1, 1 ]
            Botanist: [ 2, 2 ]
            Chef: [ 1, 1 ]
            Janitor: [ 2, 2 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            ServiceWorker: [ 2, 2 ]
          #engineering (7)
            ChiefEngineer: [ 1, 1 ]
            AtmosphericTechnician: [ 3, 3 ]
            StationEngineer: [ 3, 3 ]
            TechnicalAssistant: [ 2, 2 ] # Intern Role
          #medical (8)
            ChiefMedicalOfficer: [ 1, 1 ]
            Chemist: [ 2, 2 ]
            MedicalDoctor: [ 3, 3 ]
            MedicalIntern: [ 2, 2 ] # Intern Role
            Paramedic: [ 1, 1 ]
            Psychologist: [ 1, 1 ]
          #science (4)
            ResearchDirector: [ 1, 1 ]
            Scientist: [ 3, 3 ]
            ResearchAssistant: [ 2, 2 ] # Intern Role
          #security (7)
            HeadOfSecurity: [ 1, 1 ]
