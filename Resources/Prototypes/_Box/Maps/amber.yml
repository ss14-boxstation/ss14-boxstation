- type: gameMap
  id: Amber
  mapName: 'Amber'
  mapPath: /Maps/_Box/amber.yml
  minPlayers: 10
  maxPlayers: 40
  stations:
    Amber:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Amber Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14-SB'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_amber.yml
        - type: StationJobs
          availableJobs: # 50 jobs, 60 w/ Interns
          #service (12)
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            Bartender: [ 1, 1 ]
            Botanist: [ 2, 2 ]
            Chef: [ 1, 1 ]
            Janitor: [ 1, 1 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            ServiceWorker: [ 2, 2 ]
            Reporter: [ 1, 1 ]
          #engineering (6)
            ChiefEngineer: [ 1, 1 ]
            AtmosphericTechnician: [ 3, 3 ]
            StationEngineer: [ 2, 2 ]
            TechnicalAssistant: [ 2, 2 ] # Intern Role
          #medical (8)
            ChiefMedicalOfficer: [ 1, 1 ]
            Chemist: [ 2, 2 ]
            MedicalDoctor: [ 3, 3 ]
            Paramedic: [ 1, 1 ]
            MedicalIntern: [ 2, 2 ] # Intern Role
            Psychologist: [ 1, 1 ]
          #science (4)
            ResearchDirector: [ 1, 1 ]
            Scientist: [ 3, 3 ]
            ResearchAssistant: [ 2, 2 ] # Intern Role
          #security (7)
            HeadOfSecurity: [ 1, 1 ]
