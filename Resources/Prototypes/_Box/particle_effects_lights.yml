# Spark showers for broken lights  

- type: particleEffect
  parent: BoxSparks
  id: BoxSparksShower
  particleSize: 1.5
  rotateWithEmitter: true
  lifetime: 0.2
  lifetimeVariance: 0
  spawnOffset: 0, 0.35
  spreadAngle: 45
  emitAngle: 180
  gravity: 0
  duration: 1
  maxCount: 10
  burst: false
  bursts:
    - time: 0.0
      count: 10
    - time: 0.5
      count: 7
    - time: 0.6
      count: 5
    - time: 0.75
      count: 2
  emissionOverTime: 
    - time: 0
      value: 0
    - time: 1
      value: 0
  shape:
    type: CircleFill
    radius: 0.1

