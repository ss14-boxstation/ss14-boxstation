- type: entity
  parent: [OrganIPCInternal, OrganBaseBrain]
  id: OrganIPCProcessorHousing
  name: ipc processor housing
  description: "Contains either an Advanced Positronic Brain, or an Advanced MMI, you're not quite sure."
  components:
   - type: Sprite
     sprite: _Box/Mobs/Species/IPC/organs.rsi
     layers:
     - state: ipc-brain-on
   - type: SolutionContainerManager
     solutions:
       organ:
         reagents:
         - ReagentId: IPCOil
           Quantity: 10
       food:
         maxVol: 5
         reagents:
         - ReagentId: GreyMatter
           Quantity: 5

- type: entity
  parent: [OrganIPCVisual, OrganBaseEyes, OrganIPCInternal]
  id: OrganIPCEyes
  name: robotic eyes
  description: "01001001 00100000 01110011 01100101 01100101 00100000 01111001 01101111 01110101 00100001"
  components:
  - type: VisualOrgan
    layer: enum.HumanoidVisualLayers.Eyes
    data: 
      sprite: Mobs/Customization/eyes.rsi
      state: no_eyes

- type: entity
  parent: [OrganBaseTongue, OrganIPCInternal]
  id: OrganIPCTongue
  name: vocal modulator
  description: "A vocal modulator, used to produce speech."
  components:
  - type: Sprite
    layers:
    - state: tongue

- type: entity
  parent: [OrganBaseEars, OrganIPCInternal]
  id: OrganIPCEars
  name: sonic receptors
  description: A set of highly attuned membranes, capable of sensing anything an organic ear can sense
  components:
  - type: Sprite
    layers:
    - state: ears

- type: entity
  parent: [OrganIPCInternal, OrganIPCMetabolizer]
  id: OrganIPCPump
  name: micro pump
  description: A micro pump, used to circulate coolant and lubricant.
  components: 
  - type: Sprite
    layers:
    - state: heart-on
  - type: Metabolizer
    maxReagents: 2
    removeEmpty: true
    stages: [Bloodstream]
  - type: GibbableOrgan
  - type: Organ
    category: Heart

- type: entity
  parent: [OrganIPCInternal, OrganIPCMetabolizer]
  id: OrganIPCStomach
  name: catalytic processor
  description: A miniature chemical manipulator and biofuel generator.
  components:
  - type: Sprite
    sprite: _Box/Mobs/Species/IPC/organs.rsi
    state: ipc-stomach
  - type: Metabolizer
    maxReagents: 3
    removeEmpty: true
    stages: [ Digestion ]
  - type: Organ
    category: Stomach
  - type: Stomach
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      organ:
        reagents:
        - ReagentId: IPCOil
          Quantity: 10
  - type: GibbableOrgan
    