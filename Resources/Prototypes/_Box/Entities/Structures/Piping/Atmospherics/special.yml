- type: entity
  id: HardlightWindow
  name: hardlight window
  suffix: Box
  description: A barrier of hard light that blocks air, but nothing else. Lasts indefinitely unlike its cousin the holofan, but is not rated for pressure differences greater than 150kPa. Can be repaired with a welder.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _Box/Structures/hardlightwindow.rsi
    state: window
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.48,-0.48,0.48,-0.40"
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
      - South
  - type: Clickable
  - type: Tag
    tags:
      - SpreaderIgnore
      - Unstackable
  - type: DeltaPressure
    minPressure: 200
    minPressureDelta: 150
    scalingType: Threshold
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Glass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
  # - type: RCDDeconstructable
    # cost: 4
    # delay: 2
    # fx: EffectRCDDeconstruct2
  - type: Construction
    graph: HardlightWindowGraph
    node: entity
  - type: Repairable
    fuelCost: 15
    doAfterDelay: 3
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 30]
    trackAllDamage: true
    damageOverlay:
      sprite: _Box/Structures/hardlightwindow_overlay.rsi

- type: entity
  id: HardlightWindowAssembly
  parent: BaseItem
  name: hardlight projector
  description: A projector used to construct a hardlight window.
  suffix: Box
  components:
  - type: Tag
    tags:
    - HardlightWindowAssembly
  - type: Sprite
    sprite: _Box/Structures/hardlightwindow.rsi
    state: loose
  - type: Construction
    graph: HardlightWindowGraph
    node: item
  - type: StaticPrice
    price: 50
