- type: entity
  save: false
  id: BaseSpeciesMobSilicon
  parent: [BaseSpeciesMob, MobBloodstream, MobAtmosStandard, MobFlammable] # No Mobrespirator because Oxygen is not required for the certainty of steel
  abstract: true
  components:
    # copied over from BaseSpeciesMobOrganic and made changes based on the original BaseSpeciesMobSilicon
    # if anything gets added or removed from over there it should be mirrored here
    # Excluded components: Perishable and Respirator
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.5
        Heat: 0.1 # represents internal fluids, like coolant and lubricant, boiling away\
  - type: PassiveDamage # IPCs can heal their own bloodloss (to an extent)
    allowedStates:
    - Alive
    damagecap: 20
    damage:
      types:
        Heat: -0.02
        Blunt: -0.02
  - type: Fingerprint # IPCs have fingerprints
  - type: Blindable
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 42
  - type: TemperatureDamage
    heatDamageThreshold: 373.15 # damage point of electronics
    coldDamageThreshold: 200 # takes into account freezing point of structural elements, like plastics, and the freezing point of internal chemicals
    coldDamage:
      types: 
        Cold: 0.1 # per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat: 2
        Shock: 1 # Represents Components overheating with electrical issues resulting
  - type: ThermalRegulator # Completely new component so left unchanged from BaseOrganic
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 500
    sweatHeatRegulation: 2000
    shiveringHeatRegulation: 2000
    normalBodyTemperature: 310.15
    thermalRegulationTemperatureThreshold: 2
  - type: FireVisuals
  - type: StunVisuals
  # No more Mirroring from this point on
  - type: Tag # Mirrored from BaseSpeciesMob (i lied)
    tags:
      - CanPilot
      - FootstepSound
      - DoorBumpOpener
      - AnomalyHost # IPCs can be anomaly hosts
      - SiliconEmotes # added
  - type: Damageable
    damageContainer: HumanoidSilicon
    damageModifierSet: IPC
  # - type: Deathgasp # Commented out in original, probably for a good reason?
  #   prototype: SiliconDeathgasp
  #   needsCritical: false
  - type: MobState
    allowedStates:
      - Alive
      - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      199.999: Critical # Make it near impossible
      120: Dead
    stateAlertDict:
      # Start Box change to change health states from BorgHealth to IpcHealth, Needed for Numb to work and not also have it apply to Borgs (Unless we want that?)
      #Alive: BorgHealth
      #Critical: BorgCrit
      #Dead: BorgDead
      Alive: IpcHealth
      Critical: IpcCrit
      Dead: IpcDead
      # End Box change
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection: MetalBulletImpact
    soundTypes:
      Heat:
        collection: MetalLaserImpact
  - type: Speech
    speechSounds: Pai
  - type: Vocal
    wilhelm: "/Audio/_EE/Voice/IPC/wilhelm.ogg"
    sounds:
      Male: UnisexIPC
      Female: UnisexIPC
      Unsexed: UnisexIPC
  - type: TypingIndicator
    proto: robot
  - type: Carriable # Carrying from nyanotransen
  # stuff that makes the IPC do IPC things
  - type: Silicon
    entityType: enum.SiliconType.Player
    batteryPowered: true
    drainPerSecond: 0.6 # DeltaV change from 1.5 # Box Change - 1.3 > 0.6
    idleDrainReduction: 0.9 # TheDen - 60% less power usage while idling, for IPC Dynamic Power Draw - Box Change 0.6 --> 0.9
    chargeThresholdMid: 0.80
    chargeThresholdLow: 0.35
    chargeThresholdCritical: 0.10
    speedModifierThresholds:
      4: 1
      3: 1
      2: 0.80
      1: 0.45
      0: 0.2 # Box Change - Allow batteryless IPCs to crawl
  - type: BatteryDrinker
  - type: DeadStartupButton
    sound:
      path: /Audio/_EE/Effects/Silicon/startup.ogg
  - type: SiliconDownOnDead
  - type: EmitBuzzWhileDamaged
  - type: CanHostGuardian
  - type: WeldingHealable
  - type: CombatMode # DeltaV - let IPCs disarm
    canDisarm: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 400
      behaviors:
      - !type:GibBehavior { }
