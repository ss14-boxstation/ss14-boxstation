- type: entity
  parent: BaseSubdermalImplant
  id: WehpetImplant
  categories: [ HideSpawnMenu ]
  name: weh-pet implant
  description: An implant that expands the natural musical abilities of a Harpy. This one allows one to imitate a Weh-pet.
  components:
  - type: SubdermalImplant
    whitelist:
      components:
      - SwappableInstrument
  - type: InstrumentImplant
    instrumentList:
      "Weh-pet": {5: 1}
      "Voice": {52: 0}
      
      
- type: entity
  parent: BaseSubdermalImplant
  id: LyrebirdImplant
  categories: [ HideSpawnMenu ]
  name: lyrebird implant
  description: An implant that greatly expands the natural musical abilities of a Harpy.
  components:
  - type: SubdermalImplant
    whitelist:
      components:
      - Instrument
    blacklist:
      components:
      - Lyrebird
  - type: LyrebirdImplant
