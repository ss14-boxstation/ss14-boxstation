- type: entity
  parent: BaseWrappedCube
  name: cow cube
  id: CowCubeWrapped
  description: Unwrap this to get a cow cube.
  components:
  - type: SpawnItemsOnUse
    items:
      - id: CowCube
  - type: Sprite
    state: wrapper_kobold
    
