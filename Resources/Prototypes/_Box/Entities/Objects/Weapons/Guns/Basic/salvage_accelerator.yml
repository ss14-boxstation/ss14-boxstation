# Basic PKA
- type: entity
  parent: [ WeaponSalvageAcceleratorWieldedBase, SalvageAcceleratorUpgradeable ]
  id: WeaponProtoKineticAccelerator
  name: proto-kinetic accelerator
  description: Fires low-damage kinetic bolts at a short range.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Basic/kinetic_accelerator.rsi
    layers:
    - state: icon
    - state: animation-icon
      visible: false
      map: [ "empty-icon" ]
  - type: GenericVisualizer
    visuals:
      enum.AmmoVisuals.HasAmmo:
        empty-icon:
          True: { visible: False }
          False: { visible: True }
        # wizden: todo: add other 'empty' animations

# Kinetic Pistols
## Luxury Kinetic Revolver
- type: entity
  parent: WeaponSalvageAcceleratorSidearmBase
  id: WeaponKineticSidearmLuxury
  name: luxury kinetic revolver
  description: A retrofitted Pirate Revolver that fires low-damage kinetic bolts at a short range. Its internals are too compact, so it can't take any modkits.
  components:
  - type: Sprite
    sprite: _Box/Objects/Weapons/Guns/Kinetic/accelerator_luxury.rsi
  - type: Item
    sprite: _Box/Objects/Weapons/Guns/Kinetic/accelerator_luxury.rsi
  - type: Clothing
    sprite: _Box/Objects/Weapons/Guns/Kinetic/accelerator_luxury.rsi
  - type: BasicEntityAmmoProvider
    proto: BulletKineticPKA # TO-DO: See about making this QM only
    capacity: 1
    count: 1

## Roundstart kinetic sidearm
- type: entity
  parent: [ WeaponSalvageAcceleratorSidearmBase, SalvageAcceleratorUpgradeable ]
  id: WeaponSalvageAcceleratorSidearm
  name: proto-kinetic sidearm
  description: Fires low-damage kinetic bolts at a short range.
  components:
  - type: Sprite
    sprite: _Box/Objects/Weapons/Guns/Kinetic/accelerator_sidearm.rsi
  - type: Item
    sprite: _Box/Objects/Weapons/Guns/Kinetic/accelerator_sidearm.rsi
  - type: UpgradeableGunCost
    maxCost: 200
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.2
    rechargeSound:
      path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
  - type: Gun
    fireRate: 0.8
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/ship_svalinn.ogg

# Wieldable Accelerators
## Shotgun
- type: entity
  parent: [ WeaponSalvageAcceleratorWieldedBase ] # , SalvageAcceleratorUpgradeable ] # Scattershot weapons currently cannot take modkits
  id: WeaponSalvageAcceleratorShotgun
  name: experimental kinetic shotgun
  description: Fires a scattershot of low-damage kinetic bolts at short range.
  components:
  - type: Sprite
    sprite: _Box/Objects/Weapons/Guns/Kinetic/accelerator_shotgun.rsi
  - type: Item
    sprite: _Box/Objects/Weapons/Guns/Kinetic/accelerator_shotgun.rsi
    size: Large
    shape:
    - 0,0,2,1
  - type: Clothing
    sprite: _Box/Objects/Weapons/Guns/Kinetic/accelerator_shotgun.rsi
    slots:
    - suitStorage
  - type: BasicEntityAmmoProvider
    proto: BulletKineticShotgun
  # - type: UpgradeableGunCost # Scattershot weapons currently cannot take modkits
  #   maxCost: 60
  - type: Gun
    fireRate: 0.6 # 0.4 > 0.6 - Scattershot weapons currently cannot take modkits
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/ship_perforator.ogg
  - type: GunRequiresWield # Inaccuracy doesn't apply to spread weapons.

## Rifle
- type: entity
  parent: [ WeaponSalvageAcceleratorWieldedBase, SalvageAcceleratorUpgradeable ]
  id: WeaponSalvageAcceleratorRifle
  name: experimental kinetic rifle
  description: Fires a single high-damage kinetic bolts at medium range.
  components:
  - type: Sprite
    sprite: _Box/Objects/Weapons/Guns/Kinetic/accelerator_rifle.rsi
  - type: Item
    sprite: _Box/Objects/Weapons/Guns/Kinetic/accelerator_rifle.rsi
    size: Large
    shape:
    - 0,0,3,1
  - type: Clothing
    sprite: _Box/Objects/Weapons/Guns/Kinetic/accelerator_rifle.rsi
    quickEquip: false
    slots:
    - suitStorage
  - type: BasicEntityAmmoProvider
    proto: BulletKineticRifle
  - type: UpgradeableGunCost
    maxCost: 40
  - type: Gun
    fireRate: 0.3
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/ship_duster.ogg
  - type: GunRequiresWield # Big And Heavy

# Strange PKAs
## Xeno Shard Accelerator
- type: entity
  parent: [ WeaponSalvageAcceleratorSidearm ]
  id: WeaponSalvageAcceleratorXenoShard
  name: xeno shard accelerator
  description: a strange and otherworldly pistol that fires sharp blade-like bolts at close range.
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: UpgradeableGunCost
    maxCost: 85
  - type: RechargeEmptyAmmo
    rechargeStartSound:
      path: /Audio/Effects/lightburn.ogg
    rechargeEndSound:
      path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
  - type: Gun
    minAngle: 2
    maxAngle: 24
    fireRate: 8
    angleIncrease: 3
    angleDecay: 16
    selectedMode: FullAuto
    availableModes:
    - Burst
    - FullAuto
    burstFireRate: 16
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/energycrossbow_shoot.ogg
  - type: BasicEntityAmmoProvider
    proto: BulletKineticXenoShard
    capacity: 60
    count: 60
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.05
    rechargeSound: null
    showExamineText: false
  - type: UseDelay
    delay: 1 # 0.05 bullets per second, 60 bullets, 3 seconds until full charge - formula is cooldown = delay/capacity
