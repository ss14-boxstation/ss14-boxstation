# Medical
- type: entity
  name: Silipen
  parent: ChemicalMedipen
  id: Silipen
  description: A mixture of chemicals designed to treat IPC injuries, comes with two mini lasers to boot!
  components:
  - type: Sprite
    sprite: _Box/Objects/Specific/Medical/silipens.rsi
    layers:
    - state: silipen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: silipen_empty # temporary until i finish up the meta.json
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 15
        reagents:
        - ReagentId: RoutineMaintenance
          Quantity: 10
        - ReagentId: Nanoweldite
          Quantity: 5

- type: entity
  name: Emergency Silipen
  parent: ChemicalMedipen
  id: EmergencySilipen
  description: A mixture of chemicals designed to rapidly stabilize severely injured IPCs.
  components:
  - type: Sprite
    sprite: _Box/Objects/Specific/Medical/silipens.rsi
    layers:
    - state: emergency_silipen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: emergency_silipenempty # temporary until i finish up the meta.json
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 15
        reagents:
        - ReagentId: Overclocker
          Quantity: 12
        - ReagentId: Polydimethylsiloxane
          Quantity: 3

