# "Safe" bears for loadouts (no chance of a real heart)
- type: entity
  parent: PlushieTeddyBear
  id: PlushieTeddyBearSafe
  suffix: Loadout
  components:
  - type: EntityTableContainerFill
    containers:
      stash: !type:NestedSelector
        tableId: SafePlushieHeart

# Colored
# Names are taken from the palette list at _DEN\Palettes\teddybear.yml
     
- type: entity
  parent: PlushieTeddyBearSafe
  id: PlushieTeddyBearSafeHickory
  suffix: Loadout, Hickory
  components:
  - type: Sprite
    sprite: _DEN/Objects/Fun/teddybear.rsi
    state: teddybear
    layers:
    - state: teddybear_base_plaid
      color: "#9d6854"
      map: [ "base" ]
    - state: teddybear_accent
      color: "#fffbe5"
      map: [ "accent" ]
    - state: teddybear_ribbon
      map: [ "ribbon" ]
      visible: false
  - type: Item
    inhandVisuals: # TODO: get itemmapper inhands to work
      left:
      - state: teddybear_base-inhand-left
        color: "#9d6854"
        map: [ "teddybear_base_plaid" ]
      - state: teddybear_accent-inhand-left
        color: "#fffbe5"
        map: [ "accent" ]
      # - state: teddybear_ribbon-inhand-left
      #   map: [ "ribbon" ]
      right:
      - state: teddybear_base-inhand-right
        color: "#9d6854"
        map: [ "teddybear_base_plaid" ]
      - state: teddybear_accent-inhand-right
        color: "#fffbe5"
        map: [ "accent" ]
      # - state: teddybear_ribbon-inhand-right
      #   map: [ "ribbon" ]
      
