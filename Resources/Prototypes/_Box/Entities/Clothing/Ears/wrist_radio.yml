# Based on and heavily modified from https://github.com/new-frontiers-14/frontier-station-14/commit/a62934f044a3f460e4a3a2777e55ddf405a2e342
# Base Wristset
- type: entity
  abstract: true
  parent: ClothingHeadset
  id: BaseClothingWristset
  name: wristset
  description: An updated, modular intercom worn on the wrist. It accepts encryption keys.
  components:
  - type: Sprite
    sprite: _NF/Clothing/Ears/Headsets/wrist_color.rsi
  - type: Clothing
    sprite: _NF/Clothing/Ears/Headsets/wrist_color.rsi
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommon
      
#passenger
- type: entity
  parent: BaseClothingWristset
  id: ClothingWristsetGrey
  name: passenger wristset
  components:
  - type: Sprite
    layers:
    - state: icon
      color: "#6f6f6f"
    - state: icon-unshaded
      color: "#c6fafb"
      shader: unshaded
    - state: icon-buttons
  - type: Clothing
    clothingVisuals:
      ears:
      - state: equipped-EARS
        color: "#6f6f6f"
      - state: equipped-EARS-unshaded
        color: "#c6fafb"
        shader: unshaded

