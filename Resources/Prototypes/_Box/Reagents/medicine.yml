# Hardforked AdmiralChem

## Bic
- type: reagent
  id: Bicaridine
  name: reagent-name-bicaridine
  group: Medicine
  desc: reagent-desc-bicaridine
  physicalDesc: reagent-physical-desc-opaque
  flavor: medicine
  color: "#ffaa00"
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          groups:
            Brute: -2
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Bicaridine
          min: 15
        damage:
          types:
            Asphyxiation: 0.5
            Poison: 1.5
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: Bicaridine
          min: 30
        probability: 0.02
      - !type:Jitter
        conditions:
        - !type:ReagentCondition
          reagent: Bicaridine
          min: 15
      - !type:Drunk

