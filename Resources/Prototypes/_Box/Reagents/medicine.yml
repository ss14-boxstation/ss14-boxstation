## Insuz
- type: reagent
  id: Insuzine
  name: reagent-name-insuzine
  group: Medicine
  desc: reagent-desc-insuzine
  physicalDesc: reagent-physical-desc-frosty
  flavor: metallic
  color: "#8147ff"
  metabolisms:
    Bloodstream:
      effects:
      # heals shocks and removes shock chems
      - !type:HealthChange
        damage:
          types:
            Shock: -4
      - !type:AdjustReagent
        reagent: Licoxide
        amount: -4
      - !type:AdjustReagent
        reagent:  Tazinide
        amount: -4
      # makes you a little chilly when not oding
      - !type:AdjustTemperature
        amount: -5000
      # od makes you freeze to death
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Insuzine
          min: 12
        damage:
          types:
            Cold: 2
      - !type:AdjustTemperature
        conditions:
        - !type:ReagentCondition
          reagent: Insuzine
          min: 12
        amount: -30000
      - !type:Jitter
        conditions:
        - !type:ReagentCondition
          reagent: Insuzine
          min: 12

## Sigy
- type: reagent
  id: Sigynate
  name: reagent-name-sigynate
  group: Medicine
  desc: reagent-desc-sigynate
  physicalDesc: reagent-physical-desc-thick
  flavor: sweet
  color: "#e0a5b9"
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Caustic: -3
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Sigynate
          min: 16
        damage:
          types:
            Heat: 2
      - !type:Jitter
        conditions:
        - !type:ReagentCondition
          reagent: Sigynate
          min: 20
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Sigynate
          min: 20
        type: Local
        visualType: Medium
        messages: [ "generic-reagent-effect-nauseous" ]
        probability: 0.2
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: Sigynate
          min: 30
        probability: 0.02
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: Arithrazine
          min: 1
        probability: 0.1
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Arithrazine
          min: 1
        type: Local
        visualType: Medium
        messages: [ "generic-reagent-effect-nauseous" ]
        probability: 0.2

