          types:
            Poison:
              0.4
      - !type:Oxygenate
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Plant, Harpy ]
          inverted: true
        factor: -4
      - !type:Oxygenate 
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Harpy ]
