# If you add a new trait, make sure to add the corresponding component to the whitelist in \Resources\Prototypes\Entities\Mobs\Player\clone.yml so it gets copied to clones correctly!

# Wizden traits, moved to _Box for easier maintenance.

- type: trait
  id: Accentless
  name: trait-accentless-name
  description: trait-accentless-desc
  category: Accents
  cost: 0
  effects:
  - !type:AddCompsEffect
    components:
    - type: Accentless
      removes:
      - type: LizardAccent
      - type: MothAccent
      - type: ReplacementAccent
        accent: dwarf
      - type: NoContractionsAccent # Thaven
      - type: AllulaloAccent # Allulalo

