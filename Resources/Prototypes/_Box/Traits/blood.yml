# Don't forget to make these largely incompatible with the "Synth" trait and vice versa

- type: trait
  id: RedBlood
  name: trait-redblood-name
  description: trait-redblood-desc
  category: Blood
  conditions:
  - !type:IsSpeciesCondition
    species: Human
    invert: true
  - !type:IsSpeciesCondition
    species: Dwarf
    invert: true
  - !type:IsSpeciesCondition
    species: Reptilian
    invert: true
  - !type:IsSpeciesCondition
    species: Vulpkanin
    invert: true
  - !type:IsSpeciesCondition
    species: Rodentia
    invert: true
  - !type:IsSpeciesCondition
    species: Harpy
    invert: true
  - !type:TraitDependencyCondition
    conflicts:
    - Synth
  effects:
  - !type:ChangeBloodReagentEffect
    reagent: Blood

