# Full speech and vocal replacement traits
- type: trait
  id: BoxScurretVocals
  name: trait-scurretvocals-name
  description: trait-scurretvocals-desc
  cost: 0
  category: Vocal
  effects:
  - !type:OverrideCompsEffect
    components:
    - type: Speech
      speechVerb: Wawa
      speechSounds: Wawa
    - type: Vocal
      sounds:
        Male: Scurret
        Female: Scurret
        Unsexed: Scurret
    - type: TypingIndicator
      proto: moth

- type: trait
  id: AllulaloVocals
  name: trait-allulalovocals-name
  description: trait-allulalovocals-desc
  cost: 0
  category: Vocal
  effects:
  - !type:OverrideCompsEffect
    components:
    - type: AllulaloAccent
    - type: Speech
      speechSounds: Allulalo
      speechVerb: Allulalo
      allowedEmotes: ['Chitter', 'Hiss']
    - type: Vocal
      sounds:
        Male: UnisexAllulalo
        Female: UnisexAllulalo
        Unsexed: UnisexAllulalo
    - type: TypingIndicator
      proto: allulalo

- type: trait
  id: HarpyVocals
  name: trait-harpyvocals-name
  description: trait-harpyvocals-desc
  cost: 0
  category: Vocal
  effects: # Might need something to add the "HarpyEmotes" tag?
  - !type:OverrideCompsEffect
    components:
    - type: Speech
      speechSounds: Harpy
      speechVerb: Harpy
      allowedEmotes: ['Meow', 'Hiss', 'Purr', 'Growl', 'Bark', 'Snarl', 'Whine', 'Howl', 'Honk', 'HarpyRing', 'HarpyPew', 'HarpyBang', 'Beep', 'HarpyRev', 'HarpyCaw', 'Squish', 'Chitter', 'Squeak', 'Click', 'Squish']
    - type: Vocal
      sounds:
        Male: SoundsHarpy
        Female: SoundsHarpy
        Unsexed: SoundsHarpy
    - type: TypingIndicator
      proto: default

- type: trait
  id: AvaliVocals
  name: trait-avalivocals-name
  description: trait-avalivocals-desc
  cost: 0
  category: Vocal
  effects:
  - !type:OverrideCompsEffect
