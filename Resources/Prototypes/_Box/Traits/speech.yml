# Full speech and vocal replacement traits
- type: trait
  id: BoxScurretVocals
  name: trait-scurretvocals-name
  description: trait-scurretvocals-desc
  cost: 0
  category: Vocal
  effects:
  - !type:OverrideCompsEffect
    components:
    - type: Speech
      speechVerb: Wawa
      speechSounds: Wawa
    - type: Vocal
      sounds:
        Male: Scurret
        Female: Scurret
        Unsexed: Scurret
    - type: TypingIndicator
      proto: moth
