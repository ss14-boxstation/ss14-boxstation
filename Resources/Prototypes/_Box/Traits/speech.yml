# Basic speech-only replacement traits
- type: trait
  id: BoxRaisedByScurrets
  name: trait-raisedbyscurrets-name
  description: trait-raisedbyscurrets-desc
  cost: 0
  category: VoiceSwap
  effects:
  - !type:OverrideCompsEffect
    components:
    - type: Speech
      speechVerb: Wawa
      speechSounds: Wawa

# Full speech and vocal replacement traits
- type: trait
  id: BoxScurretVocals
  name: trait-scurretvocals-name
  description: trait-scurretvocals-desc
  cost: 0
  category: VoiceSwap
  effects:
  - !type:OverrideCompsEffect
    components:
    - type: Speech
      speechVerb: Wawa
      speechSounds: Wawa
    - type: Vocal
      sounds:
        Male: Scurret
        Female: Scurret
        Unsexed: Scurret
