# Basic speech-only replacement traits
- type: trait
  id: BoxRaisedByScurrets
  name: trait-raisedbyscurrets-name
  description: trait-raisedbyscurrets-desc
  cost: 0
  category: Vocal
  effects:
  - !type:OverrideCompsEffect
    components:
    - type: Speech
      speechVerb: Wawa
      speechSounds: Wawa
    - type: TypingIndicator
      proto: moth

