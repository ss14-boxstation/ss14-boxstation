- type: entity
  parent: BaseObjective
  abstract: true
  id: BaseTroublemakerObjective
  components:
  - type: Objective
    issuer: objective-issuer-troublemaker
    difficulty: 1 #Roleplay guidelines, not tracked, so will keep it random
  - type: RoleRequirement
    roles:
    - TroublemakerRole
  - type: NoCompletionObjective

- type: entity
  parent: BaseTroublemakerObjective
  id: TroublemakerMakeAngerKnownObjective
  name: Make Your Anger Known
  description: This workplace has wronged you. Settle the score wherever you can. Remember, you still need a job at the end of this.
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Melee/baseball_bat.rsi
      state: icon

# Departmental Grudges
- type: entity
  parent: BaseTroublemakerObjective
  id: TroublemakerMedicalGrudgeObjective
  name: Medical Malpractise
  description: On your last shift, medical botched your treatment. Show them that was a mistake.
  components:
  - type: Objective
    icon:
      sprite: Objects/Specific/Chemistry/syringe.rsi
      state: syringe_base0
  - type: NotJobRequirement
    jobs: [ MedicalDoctor, Paramedic, Chemist, Psychologist ]

- type: entity
  parent: BaseTroublemakerObjective
  id: TroublemakerSupplyGrudgeObjective
  name: Supply Issues
  description: Cargo have misplaced your plushie order for the last time. Remind them of their logistical obligations. Painfully if needed.
  components:
  - type: Objective
    icon:
      sprite: Objects/Economy/cash.rsi
      state: cash_1000
  - type: NotJobRequirement
    jobs: [ CargoTechnician, SalvageSpecialist ]

- type: entity
  parent: BaseTroublemakerObjective
  id: TroublemakerScienceGrudgeObjective
  name: Anti-intellectualism
  description: Holes in the station here, anomalies there, you've had enough of the flagrant lack of safety from Science. Make sure their "accidents" effect them too.
  components:
  - type: Objective
    icon:
      sprite: Objects/Specific/Research/researchdisk.rsi
      state: icon

- type: entity
  parent: BaseTroublemakerObjective
  id: TroublemakerEngineeringGrudgeObjective
  name: Blackout Rage
  description: Constant blackouts, patchy repair jobs, and the only people around are too busy tinkering with the pipes to fix the hull. Make some new holes so they're forced to do their job for once.
  components:
  - type: Objective
    icon:
      sprite: Objects/Tools/wrench.rsi
      state: icon
  - type: NotJobRequirement
    jobs: [ StationEngineer, AtmosphericTechnician ]

- type: entity
  parent: BaseTroublemakerObjective
  id: TroublemakerServiceGrudgeObjective
  name: 1/5 Stars
  description: Filthy corridors, the bartender's more interested in their gun than their drinks, the kitchen gave you food-poisoning, and why did we even HIRE that clown? Remind service they're here to serve.
  components:
  - type: Objective
    icon:
      sprite: Clothing/OuterClothing/Misc/apron.rsi
      state: icon
  - type: NotJobRequirement
    jobs: [ Bartender, ServiceWorker, Clown, Janitor, Chef, Mime, Chaplain, Botanist, Librarian, Reporter, Boxer, Zookeeper ]

#Individual Grudges
- type: entity
  parent: BaseTroublemakerObjective
  id: TroublemakerIndividualGrudgeObjective
  description: They've wronged you for the last time. Settle your grudge however you see fit, whatever that grudge may be.
  components:
  - type: Objective
    icon:
      sprite: Objects/Misc/book.rsi
      state: cover_old
  - type: TargetObjective
    title: troublemaker-objective-grudge-individual-title
  - type: PickRandomPerson

