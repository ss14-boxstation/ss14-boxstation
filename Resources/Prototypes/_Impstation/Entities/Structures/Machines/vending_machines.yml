- type: entity
  parent: VendingMachine
  id: VendingMachineSalvDrobe
  name: SalvDrobe
  description: A highly advanced vending machine for buying salvager related clothing for free.
  components:
  - type: VendingMachine
    pack: SalvDrobeInventory
    offState: off
    brokenState: broken
    normalState: normal-unshaded
    #soundVend: /Audio/_Impstationn/Machines/vending_drop.ogg # Box Change: WizDen sounds 
  # Start Box Change: Advertise -> DatasetVocalizer
  - type: DatasetVocalizer
    dataset: SalvDrobeAds
  # End Box Change
  - type: SpeakOnUIClosed
    pack: GenericVendGoodbyes
  - type: Sprite
    sprite: _Impstation/Structures/Machines/VendingMachines/salvdrobe.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#b89f25"
  - type: AccessReader
    access: [["Cargo"]]
  # Start Box Change: Don't steal the drip please
  #- type: StealTarget #imp
  #  stealGroup: SalvDrobe
  # End Box Change
