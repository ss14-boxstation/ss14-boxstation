- type: markingsGroup
  id: Thaven
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: true
      default: [ ThavenEars1 ]
    enum.HumanoidVisualLayers.Head:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Overlay:
      limit: 6
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceThaven
  name: thaven appearance
  components:
  - type: Inventory
    templateId: thaven
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Thaven/displacement.rsi
            state: jumpsuit
      outerClothing:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Thaven/displacement.rsi
            state: outerclothing_hardsuit
      head:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Thaven/displacement.rsi
            state: head
      gloves:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Thaven/displacement.rsi
            state: hands
  - type: InitialBody
    organs:
      Torso: OrganThavenTorso
      Head: OrganThavenHead
      ArmLeft: OrganThavenArmLeft
      ArmRight: OrganThavenArmRight
      HandLeft: OrganThavenHandLeft
      HandRight: OrganThavenHandRight
      LegLeft: OrganThavenLegLeft
      LegRight: OrganThavenLegRight
      FootLeft: OrganThavenFootLeft
      FootRight: OrganThavenFootRight
      Brain: OrganThavenBrain
      Eyes: OrganThavenEyes
      Ears: OrganHumanEars
      Appendix: OrganHumanAppendix
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Thaven

- type: entity
  parent:
  - AppearanceThaven
  - BaseSpeciesMobOrganic
  id: MobThaven
  name: Urist McEars
  components:
  - type: Icon
    sprite: _Impstation/Mobs/Species/Thaven/parts.rsi # Unlike dwarves elves are NOT made of slime
    state: full
  - type: ThavenMoods
  - type: Respirator
    damage:
      types:
        Asphyxiation: 2
    damageRecovery:
      types:
        Asphyxiation: -1.0
  - type: Damageable
    damageModifierSet: Thaven
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#ff624a"
  - type: MeleeWeapon
    attackRate: 0.55
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 0
  - type: StaminaDamageOnHit
    damage: 18
  - type: Butcherable
    butcheringType: Spike
    spawned:
      - id: FoodThavenMeat
        amount: 5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 120
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: TypingIndicator
    proto: thaven # DeltaV unique typing indicator
  - type: Vocal
    sounds:
      Male: MaleThaven
      Female: FemaleThaven
      Unsexed: UnisexThaven
  - type: Speech
    speechSounds: Alto
  - type: NoContractionsAccent
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: ShimmeringBlood
        Quantity: 300
  # Start Box Change: starcup footprints
  - type: FootprintOwner
    footprint: lizardFootprint
  # End Box Change

- type: entity
  parent: OrganBase
  id: OrganThaven
  abstract: true
  suffix: Thaven

- type: entity
  id: OrganThavenMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Thaven ]

- type: entity
  parent: OrganThaven
  id: OrganThavenInternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Impstation/Mobs/Species/Thaven/organs.rsi
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: CarpoToxin
        Quantity: 5
  - type: FlavorProfile
    flavors:
      - thavenflesh
  - type: Solution
    solution:
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 10
      - ReagentId: CarpoToxin
        Quantity: 10

- type: entity
  parent: OrganThaven
  id: OrganThavenExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Impstation/Mobs/Species/Thaven/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Impstation/Mobs/Species/Thaven/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Thaven

- type: entity
  parent: [ OrganBaseTorso, OrganThavenExternal ]
  id: OrganThavenTorso

- type: entity
  parent: [ OrganBaseHead, OrganThavenExternal ]
  id: OrganThavenHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.HeadSide
    - enum.HumanoidVisualLayers.Snout

- type: entity
  parent: [ OrganBaseArmLeft, OrganThavenExternal ]
  id: OrganThavenArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganThavenExternal ]
  id: OrganThavenArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganThavenExternal ]
  id: OrganThavenHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganThavenExternal ]
  id: OrganThavenHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganThavenExternal ]
  id: OrganThavenLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganThavenExternal ]
  id: OrganThavenLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganThavenExternal ]
  id: OrganThavenFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganThavenExternal ]
  id: OrganThavenFootRight

- type: entity
  parent: [ OrganBaseBrain, OrganThavenInternal ]
  id: OrganThavenBrain
  description: "An organic positronic brain. Quite remarkable, really."
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: GreyMatter
        Quantity: 3
      - ReagentId: CarpoToxin
        Quantity: 12

- type: entity
  parent: [ OrganThavenInternal, OrganThavenExternal, OrganBaseEyes ]
  id: OrganThavenEyes
  name: eyes
  description: "The dark sclera have a faint, iridescent coating."

- type: entity
  parent: [ OrganBaseLungs, OrganThavenInternal, OrganThavenMetabolizer ]
  id: OrganThavenLungs
  description: "Technically not lungs since they don't draw chemicals from the air, these strange, durable organs use the motion of respiration to provide energy for cell maintenance."

- type: entity
  parent: [ OrganBaseHeart, OrganThavenInternal, OrganThavenMetabolizer ]
  id: OrganThavenHeart
  description: "The toxic heart of a thaven. You're wearing gloves, right?"

- type: entity
  parent: [ OrganBaseStomach, OrganThavenInternal, OrganThavenMetabolizer ]
  id: OrganThavenStomach
  description: "Surprisingly similar to the stomach of a sharkminnow."

- type: entity
  parent: [ OrganBaseLiver, OrganThavenInternal, OrganThavenMetabolizer ]
  id: OrganThavenLiver
  description: "It loosely resembles a slab of dragon flesh."

- type: entity
  parent: [ OrganBaseKidneys, OrganThavenInternal, OrganThavenMetabolizer ]
  id: OrganThavenKidneys
  description: "Shiny, coppery veins make these the most ornate kidneys known to modern science."
