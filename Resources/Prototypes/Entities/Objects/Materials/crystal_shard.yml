- type: entity
  abstract: true
  parent: BaseItem
  id: ShardCrystalBase
  name: crystal shard
  description:  A small piece of crystal.
  components:
  - type: Sharp
  - type: Execution
    doAfterDuration: 4.0
  - type: Sprite
    layers:
      - sprite: Objects/Materials/Shards/crystal.rsi
        state: shard1
        map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: RandomSprite
    available:
      - enum.DamageStateVisualLayers.Base:
          shard1: ""
          shard2: ""
          shard3: ""
  - type: SpaceGarbage
  - type: MeleeWeapon
    wideAnimationRotation: -22.5
    attackRate: 1.5
    damage:
      types:
        Slash: 3.5
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Glass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 50

# Box Change Start
- type: entity
  abstract: true
  id: ShardCrystalGrindable
  components:
  - type: Extractable
    grindableSolutionName: crystal
  - type: SolutionContainerManager
    solutions:
      crystal:
        reagents:
        - ReagentId: Silicon # Generic Crystals tend to be Quartz
          Quantity: 5
        - ReagentId: Plasma # For the Intense Glow
          Quantity: 0.1
        - ReagentId: Iron # Most of the crystals if they were quartz are coloured by Iron. Easier to declare it once.
          Quantity: 1
# Box Change End

- type: entity
  parent: [ShardCrystalBase, ShardCrystalGrindable] # Box Change - Add grindable
  id: ShardCrystalCyan
  name: cyan crystal shard
  description: A small piece of crystal.
  components:
  - type: Sprite
    color: "#47f8ff"
  - type: PointLight
    radius: 2
    energy: 2.5
    color: "#47f8ff"
  - type: Tag
    tags:
      - Trash
      - CrystalCyan
  # Box Change Start
  - type: SolutionContainerManager
    solutions:
      crystal:
        reagents:
        - ReagentId: Silicon # Generic Crystals tend to be Quartz
          Quantity: 5
        - ReagentId: Plasma # For the Intense Glow
          Quantity: 0.1
        - ReagentId: Potassium
          Quantity: 1
        - ReagentId: Aluminium
