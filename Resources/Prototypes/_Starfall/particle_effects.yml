- type: particleEffect
  id: SfGibMist
  sprite:
    sprite: _Starfall/Particles/generic.rsi
    state: soft_dot_big
  startColor: "#FFFFFFFF" #Gets changed by GibParticleSystem's ColorOverride to match the victim's blood color.
  endColor: "#FFFFFF00"
  alphaOverLifetime:
    - time: 0.0
      value: 1
    - time: 0.08
      value: 1
    - time: 0.5
      value: 0.6
    - time: 1.0
      value: 0.0
  particleSize: 0.5
  sizeVariance: 0.3
  sizeOverLifetime:
    - time: 0.0
      value: 0.3
    - time: 0.2
      value: 1.2
    - time: 1.0
      value: 2.0
  lifetime: 1.4
  lifetimeVariance: 0.4
  speedVariance: 1.2
  gravity: 1
  drag: 0.85
  noiseStrength: 0.5
  noiseFrequency: 0.9
  startRotationVariance: 60
  rotationSpeed: 1
  rotationSpeedVariance: 45
  maxCount: 55
  burst: true
  simulationSpace: grid
  shape:
    type: CircleFill
    radius: 0.2
  spreadAngle: 60

