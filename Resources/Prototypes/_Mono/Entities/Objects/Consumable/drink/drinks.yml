- type: entity
  parent: DrinkGlass
  id: DrinkChamomileTea
  suffix: chamomile tea
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: ChamomileTea
          Quantity: 30
  - type: Icon
    sprite: _Box/Objects/Consumable/Drinks/Tea/chamomileteaglass.rsi # Box Change: Resprite
    state: icon

