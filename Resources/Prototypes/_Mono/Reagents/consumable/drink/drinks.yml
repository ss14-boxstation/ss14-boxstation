- type: reagent
  id: YorkshireTea
  name: reagent-name-tea-yorkshire
  parent: BaseDrink
  desc: reagent-desc-tea-yorkshire
  physicalDesc: reagent-physical-desc-robust
  flavor: teaYorkshire
  color: "#4B3621"
  metamorphicSprite:
    sprite: _Box/Objects/Consumable/Drinks/Tea/yorkshireteaglass.rsi # Box Change: Resprite
    state: icon_empty
  metamorphicMaxFillLevels: 4 # Box Change: 2 -> 4
  metamorphicFillBaseName: fill-
  metamorphicChangeColor: false
  # Start Box Change: consistency with black tea
  metabolisms:
    Digestion:
      metabolites:
        Theobromine: 0.1
      effects:
      - !type:SatiateThirst
        factor: 3
      - !type:GenericStatusEffect
        key: Drowsiness
        time: 1.0
        type: Remove
  # End Box Change

