- type: reagent
  id: SyndicateTea
  name: reagent-name-tea-syndie
  parent: BaseDrink
  desc: reagent-desc-tea-syndie
  physicalDesc: reagent-physical-desc-spicy
  flavor: teaSyndie
  color: "#FF0000"
  metamorphicSprite:
    sprite: _Box/Objects/Consumable/Drinks/Tea/syndieteaglass.rsi # Box Change: Resprite
    state: icon_empty
  metamorphicMaxFillLevels: 4 # Box Change: 2 -> 4 # Box Change: 4 -> 2 because it only has 2 sprites...
  metamorphicFillBaseName: fill-
  metamorphicChangeColor: false
  # Start Box Change: Add caffiene effect and theobromine metabolite. same effects as red bool, just better thirst satiation
  metabolisms:
    Digestion:
      metabolites:
        Theobromine: 0.2
      effects:
      - !type:SatiateThirst
        factor: 3
      - !type:GenericStatusEffect
        key: Drowsiness
        time: 2.0
        type: Remove
  # End Box Change

